<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Simple Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 300px;
            text-align: center;
        }
        h2 { margin-bottom: 20px; color: #333; }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 97%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover { background-color: #0056b3; }
        .message { margin-top: 15px; font-size: 14px; font-weight: bold; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Firebase Login</h2>
    <input type="email" id="email" placeholder="Email Address" required>
    <input type="password" id="password" placeholder="Password" required>
    <button id="loginBtn">Log In</button>
    <button id="signupBtn" style="background-color: #28a745;">Sign Up</button>
    <div id="message" class="message"></div>
</div>

<script type="module">
  import { initializeApp } from "https://gstatic.com";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://gstatic.com";

  // আপনার স্ক্রিনশট থেকে নেওয়া কনফিগারেশন
  const firebaseConfig = {
    apiKey: "AIzaSyCUPpSdUfW-gTIDasXMuiLSJWU9EwpCTkw",
    authDomain: "://firebaseapp.com",
    projectId: "new-test-c7d82",
    storageBucket: "new-test-c7d82.firebasestorage.app",
    messagingSenderId: "245984911721",
    appId: "1:245984911721:web:548bf4131dac250eaf9df8",
    measurementId: "G-F4T6HJJQPN"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const loginBtn = document.getElementById('loginBtn');
  const signupBtn = document.getElementById('signupBtn');
  const messageDiv = document.getElementById('message');

  signupBtn.addEventListener('click', () => {
      const email = emailInput.value;
      const password = passwordInput.value;
      createUserWithEmailAndPassword(auth, email, password)
          .then(() => { showMessage("Account created successfully! You can log in now.", "success"); })
          .catch((error) => { showMessage(error.message, "error"); });
  });

  loginBtn.addEventListener('click', () => {
      const email = emailInput.value;
      const password = passwordInput.value;
      signInWithEmailAndPassword(auth, email, password)
          .then(() => { showMessage("Login Successful! Welcome.", "success"); })
          .catch((error) => { showMessage(error.message, "error"); });
  });

  function showMessage(text, type) {
      messageDiv.innerText = text;
      messageDiv.className = `message ${type}`;
  }
</script>

</body>
</html>
