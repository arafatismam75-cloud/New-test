<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Firebase Simple Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .login-container {
            background: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);

            width: 100%;
            max-width: 350px;

            text-align: center;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #333;
        }

        input {
            width: 100%;

            padding: 12px;

            margin: 8px 0;

            border: 1px solid #ccc;
            border-radius: 5px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #007bff;
        }

        button {
            width: 100%;

            padding: 12px;

            color: white;

            border: none;
            border-radius: 5px;

            cursor: pointer;

            font-size: 16px;

            margin-top: 10px;

            transition: 0.2s;
        }

        #loginBtn {
            background-color: #007bff;
        }

        #loginBtn:hover {
            background-color: #0056b3;
        }

        #signupBtn {
            background-color: #28a745;
        }

        #signupBtn:hover {
            background-color: #1e7e34;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;

            font-size: 14px;

            font-weight: bold;

            line-height: 1.5;

            min-height: 20px;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        .info {
            color: #555;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h2>Firebase Login</h2>

        <input
            type="email"
            id="email"
            placeholder="Email Address"
            autocomplete="email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button id="loginBtn">
            Log In
        </button>

        <button id="signupBtn">
            Sign Up
        </button>

        <div id="message" class="message"></div>

    </div>


    <!-- =====================================================
         FIREBASE
    ====================================================== -->

    <script type="module">

        // Firebase App
        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


        // Firebase Authentication
        import {
            getAuth,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


        // =====================================================
        // FIREBASE CONFIGURATION
        // =====================================================

        const firebaseConfig = {

            apiKey: "AIzaSyCUPpSdUfW-gTIDasXMuiLSJWU9EwpCTkw",

            authDomain: "new-test-c7d82.firebaseapp.com",

            projectId: "new-test-c7d82",

            storageBucket: "new-test-c7d82.firebasestorage.app",

            messagingSenderId: "245984911721",

            appId: "1:245984911721:web:548bf4131dac250eaf9df8",

            measurementId: "G-F4T6HJJQPN"
        };


        // =====================================================
        // INITIALIZE FIREBASE
        // =====================================================

        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);


        // =====================================================
        // GET HTML ELEMENTS
        // =====================================================

        const emailInput = document.getElementById("email");

        const passwordInput = document.getElementById("password");

        const loginBtn = document.getElementById("loginBtn");

        const signupBtn = document.getElementById("signupBtn");

        const messageDiv = document.getElementById("message");


        // =====================================================
        // SIGN UP
        // =====================================================

        signupBtn.addEventListener("click", async () => {

            const email = emailInput.value.trim();

            const password = passwordInput.value;


            // Empty check
            if (!email || !password) {

                showMessage(
                    "Please enter Email and Password.",
                    "error"
                );

                return;
            }


            // Password length check
            if (password.length < 6) {

                showMessage(
                    "Password must be at least 6 characters.",
                    "error"
                );

                return;
            }


            // Disable buttons
            setButtonsDisabled(true);

            showMessage(
                "Creating account...",
                "info"
            );


            try {

                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


                showMessage(
                    "Account created successfully!",
                    "success"
                );


                // Clear password
                passwordInput.value = "";


            } catch (error) {

                console.error(error);

                showMessage(
                    getFirebaseError(error),
                    "error"
                );

            }


            setButtonsDisabled(false);

        });


        // =====================================================
        // LOGIN
        // =====================================================

        loginBtn.addEventListener("click", async () => {

            const email = emailInput.value.trim();

            const password = passwordInput.value;


            // Empty check
            if (!email || !password) {

                showMessage(
                    "Please enter Email and Password.",
                    "error"
                );

                return;
            }


            // Disable buttons
            setButtonsDisabled(true);

            showMessage(
                "Logging in...",
                "info"
            );


            try {

                const userCredential =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                console.log(
                    "Logged in user:",
                    userCredential.user
                );


                showMessage(
                    "Login Successful! Welcome.",
                    "success"
                );


            } catch (error) {

                console.error(error);

                showMessage(
                    getFirebaseError(error),
                    "error"
                );

            }


            setButtonsDisabled(false);

        });


        // =====================================================
        // FIREBASE ERROR MESSAGE
        // =====================================================

        function getFirebaseError(error) {

            switch (error.code) {

                case "auth/invalid-email":
                    return "Invalid email address.";

                case "auth/user-not-found":
                    return "No account found with this email.";

                case "auth/wrong-password":
                    return "Incorrect password.";

                case "auth/invalid-credential":
                    return "Invalid email or password.";

                case "auth/email-already-in-use":
                    return "This email is already registered.";

                case "auth/weak-password":
                    return "Password must be at least 6 characters.";

                case "auth/operation-not-allowed":
                    return "Email/Password Authentication is not enabled in Firebase.";

                case "auth/too-many-requests":
                    return "Too many attempts. Please try again later.";

                default:
                    return error.message || "Something went wrong.";
            }
        }


        // =====================================================
        // SHOW MESSAGE
        // =====================================================

        function showMessage(text, type) {

            messageDiv.innerText = text;

            messageDiv.className =
                "message " + type;
        }


        // =====================================================
        // DISABLE / ENABLE BUTTONS
        // =====================================================

        function setButtonsDisabled(disabled) {

            loginBtn.disabled = disabled;

            signupBtn.disabled = disabled;
        }

    </script>

</body>
</html>
