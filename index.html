<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Firebase Simple Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f9;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 350px;

            background: #ffffff;

            padding: 30px;

            border-radius: 10px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);

            text-align: center;
        }

        h2 {
            margin: 0 0 25px 0;
            color: #222;
        }

        input {
            width: 100%;

            padding: 12px;

            margin: 8px 0;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #007bff;
        }

        button {
            width: 100%;

            padding: 12px;

            margin-top: 10px;

            border: none;

            border-radius: 5px;

            color: white;

            font-size: 16px;

            cursor: pointer;

            transition: 0.2s;
        }

        #loginBtn {
            background: #007bff;
        }

        #loginBtn:hover {
            background: #0056b3;
        }

        #signupBtn {
            background: #28a745;
        }

        #signupBtn:hover {
            background: #1e7e34;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;

            min-height: 22px;

            font-size: 14px;

            font-weight: bold;

            line-height: 1.5;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        .info {
            color: #555;
        }
    </style>
</head>


<body>

    <div class="login-container">

        <h2>Firebase Login</h2>

        <input
            type="email"
            id="email"
            placeholder="Email Address"
            autocomplete="email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button id="loginBtn">
            Log In
        </button>

        <button id="signupBtn">
            Sign Up
        </button>

        <div id="message"></div>

    </div>


    <!-- =====================================================
         FIREBASE SCRIPT
    ====================================================== -->

    <script type="module">

        // =====================================================
        // FIREBASE SDK
        // =====================================================

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


        import {
            getAuth,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


        // =====================================================
        // FIREBASE CONFIG
        // Project: new-test-c7d82
        // =====================================================

        const firebaseConfig = {

            apiKey: "AIzaSyCUPpSdUfW-gTIDasXMuiLSJWU9EwpCTkw",

            authDomain: "new-test-c7d82.firebaseapp.com",

            projectId: "new-test-c7d82",

            storageBucket: "new-test-c7d82.firebasestorage.app",

            messagingSenderId: "245984911721",

            appId: "1:245984911721:web:548bf4131dac250eaf9df8",

            measurementId: "G-F4T6HJJQPN"
        };


        // =====================================================
        // INITIALIZE FIREBASE
        // =====================================================

        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);


        // =====================================================
        // HTML ELEMENTS
        // =====================================================

        const emailInput = document.getElementById("email");

        const passwordInput = document.getElementById("password");

        const loginBtn = document.getElementById("loginBtn");

        const signupBtn = document.getElementById("signupBtn");

        const messageDiv = document.getElementById("message");


        // =====================================================
        // SIGN UP
        // =====================================================

        signupBtn.addEventListener("click", async function () {

            const email = emailInput.value.trim();

            const password = passwordInput.value;


            // Check email
            if (email === "") {

                showMessage(
                    "Please enter your email address.",
                    "error"
                );

                return;
            }


            // Check password
            if (password === "") {

                showMessage(
                    "Please enter your password.",
                    "error"
                );

                return;
            }


            // Minimum password length
            if (password.length < 6) {

                showMessage(
                    "Password must be at least 6 characters.",
                    "error"
                );

                return;
            }


            setButtons(true);

            showMessage(
                "Creating account...",
                "info"
            );


            try {

                const userCredential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                console.log(
                    "Account created:",
                    userCredential.user
                );


                showMessage(
                    "Account created successfully!",
                    "success"
                );


                passwordInput.value = "";


            } catch (error) {

                console.error(
                    "SIGN UP ERROR:",
                    error
                );


                showMessage(
                    firebaseError(error),
                    "error"
                );

            }


            setButtons(false);

        });


        // =====================================================
        // LOGIN
        // =====================================================

        loginBtn.addEventListener("click", async function () {

            const email = emailInput.value.trim();

            const password = passwordInput.value;


            // Check email
            if (email === "") {

                showMessage(
                    "Please enter your email address.",
                    "error"
                );

                return;
            }


            // Check password
            if (password === "") {

                showMessage(
                    "Please enter your password.",
                    "error"
                );

                return;
            }


            setButtons(true);

            showMessage(
                "Logging in...",
                "info"
            );


            try {

                const userCredential =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                console.log(
                    "Login successful:",
                    userCredential.user
                );


                showMessage(
                    "Login Successful! Welcome.",
                    "success"
                );


            } catch (error) {

                console.error(
                    "LOGIN ERROR:",
                    error
                );


                showMessage(
                    firebaseError(error),
                    "error"
                );

            }


            setButtons(false);

        });


        // =====================================================
        // FIREBASE ERROR
        // =====================================================

        function firebaseError(error) {

            console.log(
                "Firebase Error Code:",
                error.code
            );


            switch (error.code) {

                case "auth/invalid-email":

                    return "Invalid email address.";


                case "auth/user-not-found":

                    return "No account found with this email.";


                case "auth/wrong-password":

                    return "Incorrect password.";


                case "auth/invalid-credential":

                    return "Invalid email or password.";


                case "auth/email-already-in-use":

                    return "This email is already registered.";


                case "auth/weak-password":

                    return "Password must be at least 6 characters.";


                case "auth/operation-not-allowed":

                    return "Email/Password authentication is not enabled in Firebase.";


                case "auth/too-many-requests":

                    return "Too many attempts. Please try again later.";


                case "auth/network-request-failed":

                    return "Network error. Please check your internet connection.";


                default:

                    return error.message || "Something went wrong.";

            }

        }


        // =====================================================
        // SHOW MESSAGE
        // =====================================================

        function showMessage(text, type) {

            messageDiv.textContent = text;

            messageDiv.className = type;

        }


        // =====================================================
        // BUTTON ENABLE / DISABLE
        // =====================================================

        function setButtons(disabled) {

            loginBtn.disabled = disabled;

            signupBtn.disabled = disabled;

        }

    </script>

</body>

</html>
